name: CI/CD Frontend Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Angular compatible et stable

      - name: Install dependencies
        run: npm install

      - name: Build Angular project
        run: npm run build -- --configuration production

      - name: Deploy to test environment
        if: github.ref == 'refs/heads/dev'
        run: echo "🚀 Déploiement automatique frontend sur l'environnement dev"

      - name: Install SendGrid SDK
        run: npm install @sendgrid/mail

      - name: Send email notification via SendGrid
        if: always()
        run: |
          node -e "
          const sgMail = require('@sendgrid/mail');
          sgMail.setApiKey(process.env.SEND_MESSAGE_KEY);

          const status = '${{ job.status }}';
          const subject = status === 'success'
            ? '✅ Frontend build succeeded on dev'
            : '❌ Frontend build failed on dev';

          const body = `
          Bonjour l'équipe Anilaye 👋,

          Le build Angular 19 sur la branche *dev* a terminé avec le statut : **${status}**.

          📌 Repository: ${{ github.repository }}
          📌 Branch: ${{ github.ref }}
          📌 Commit: ${{ github.sha }}
          🔗 Lien: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          --
          GitHub Actions 🚀
          `;

          sgMail.send({
            to: [
              'arona010ndiaye@gmail.com',
              'aichasy2188@gmail.com',
              'takkinoyaya@gmail.com',
              'nguiranebabacar305@gmail.com',
              'maladongom104@gmail.com'
            ],
            from: 'ahmedmballo7@gmail.com',
            subject: subject,
            text: body,
            html: body.replace(/\\n/g, '<br>')
          }).then(() => console.log('✅ Email envoyé !'))
            .catch(err => console.error('❌ Erreur envoi email:', err));
        env:
          SEND_MESSAGE_KEY: ${{ secrets.SEND_MESSAGE_KEY }}
