name: CI/CD Frontend Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Angular project
        run: npm run build -- --configuration production

      - name: Deploy to test environment
        if: github.ref == 'refs/heads/dev'
        run: echo "🚀 Déploiement automatique frontend sur l'environnement dev"

      - name: Get commit message
        id: commit_msg
        run: |
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      - name: Install SendGrid SDK
        run: npm install @sendgrid/mail

      - name: Send email notification via SendGrid
        if: always()
        run: node send-email.js
        env:
          SEND_MESSAGE_KEY: ${{ secrets.SEND_MESSAGE_KEY }}
          JOB_STATUS: ${{ job.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
