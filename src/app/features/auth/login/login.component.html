<div class="login-container">
  <!-- Partie gauche -->
  <div class="login-left">
    <div class="logo-corner">
      <img src="assets/woterflow_img.png" alt="Logo Waterflow">
    </div>
    <div class="logo-text">
      <h2>Connectez vous</h2>
      <p>Bienvenue de retour sur la plateforme !</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Champ Email -->
      <div class="form-group">
        <div class="input-icon" [class.invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <i class="fas fa-user"></i>
          <input 
            id="email" 
            type="text" 
            formControlName="email" 
            placeholder="Adresse email ou numéro de téléphone">
        </div>
      </div>

      <!-- Champ Mot de passe -->
      <div class="form-group">
        <div class="input-icon password-wrapper" [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <i class="fas fa-lock"></i>
          <input 
            [type]="showPassword ? 'text' : 'password'"
            id="password" 
            formControlName="password" 
            placeholder="Mot de passe">
          <i class="fas"
             [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
             (click)="togglePasswordVisibility()"></i>
        </div>
        <a class="forgot-link" routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton Connexion -->
      <button type="submit" [disabled]="isLoading" class="btn-login">
        <span *ngIf="!isLoading">Connexion</span>
        <span *ngIf="isLoading" class="loading-spinner"></span>
      </button>
    </form>

    <!-- Lien inscription -->
    <p class="register-text">
      Vous n'avez pas de compte ? 
      <a routerLink="/register">Créer un compte</a>
    </p>
  </div>

  <!-- Partie droite (image) -->
  <div class="login-right">
    <img src="assets/login_img.png" alt="Illustration maman et enfant">
  </div>
</div>
