<div class="login-container">
    <div class="login-card">
      <h2>Connexion à Anilaye</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="Votre email"
            [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email est obligatoire</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">L'email doit être valide</span>
          </div>
        </div>
  
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="Votre mot de passe"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est obligatoire</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
              Le mot de passe doit avoir au moins 6 caractères
            </span>
          </div>
        </div>
  
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
  
        <button 
          type="submit" 
          class="login-button" 
          [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
  
      <div class="register-link">
        <p>Vous n'avez pas de compte ? <a routerLink="/register">Créer un compte</a></p>
      </div>
    </div>
  </div>
